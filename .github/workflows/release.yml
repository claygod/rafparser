name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*' # Запускается автоматически при пуше тегов (например, v0.1.12)

permissions:
  contents: write # Разрешение для автоматического прикрепления бинарников к релизу

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install MSYS2 and LibRaw for Windows
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit # Пробрасывает PATH из Windows в MSYS2 для поиска go
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libraw
            mingw-w64-x86_64-zlib

      - name: Build Windows Binary
        shell: msys2 {0}
        run: |
          # -DLIBRAW_NODLL переводит заголовки в статический режим
          export CGO_CFLAGS="-I/mingw64/include -DLIBRAW_NODLL"
          # ДОБАВЛЕН ФЛАГ -lz для устранения ошибки 'uncompress'
          export CGO_LDFLAGS="-L/mingw64/lib -lraw -static -lstdc++ -lgomp -ljpeg -llcms2 -lz -lws2_32 -lmingwthrd"
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -o rafparser.exe .

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rafparser-windows
          path: rafparser.exe

  build-linux:
    runs-on: ubuntu-22.04 # Используем поддерживаемый стабильный сервер GitHub КРИТИЧЕСКОЕ ИСПРАВЛЕНИЕ - гарантирует совместимость со старыми версиями GLIBC вместо ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install LibRaw for Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libraw-dev libjpeg-dev liblcms2-dev

      - name: Build Linux Binary
        run: |
          # Внедряем ручное запекание libraw.a и системных библиотек.
          # Флаг -Wl,--hash-style=both и базовая ubuntu-22.04 понизят планку GLIBC,
          # сделав бинарник запускаемым на старых дистрибутивах.
          export CGO_CFLAGS="-I/usr/include"
          export CGO_LDFLAGS="/usr/lib/x86_64-linux-gnu/libraw.a -lm -lgomp -lstdc++ -pthread -ljpeg -llcms2 -lz -Wl,--hash-style=both"
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -o rafparser-linux .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rafparser-linux-artifact
          path: rafparser-linux


      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rafparser-linux-artifact
          path: rafparser-linux

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install LibRaw for macOS
        run: |
          brew update
          brew install libraw

      - name: Build macOS Binary
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -o rafparser-mac .

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rafparser-macos-artifact
          path: rafparser-mac

  create-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true # Собирает все файлы в один плоский корень релиза

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rafparser.exe
            rafparser-linux
            rafparser-mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

